function log(msg) {
  const d = document.getElementById('log');
  const l = document.createElement('div');
  l.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  d.appendChild(l);
  d.scrollTop = d.scrollHeight;
}

function setProgress(v) {
  document.getElementById('progress').style.width = v + '%';
}

async function importBudgets() {
  document.getElementById('btnImport').disabled = true;
  document.getElementById('status').textContent = '⏳ Importando...';
  log('Iniciando importación de ' + BUDGETS.length + ' presupuestos...');

  try {
    // Borrar presupuestos anteriores
    log('Limpiando presupuestos previos...');
    const old = await db.collection('budgets').get();
    const delBatch = db.batch();
    old.docs.forEach(d => delBatch.delete(d.ref));
    await delBatch.commit();
    log('✓ ' + old.size + ' presupuestos anteriores eliminados');

    // Importar en lotes de 400
    const batchSize = 400;
    let count = 0;
    for (let i = 0; i < BUDGETS.length; i += batchSize) {
      const batch = db.batch();
      const chunk = BUDGETS.slice(i, i + batchSize);
      chunk.forEach(b => {
        const ref = db.collection('budgets').doc();
        batch.set(ref, {
          ...b,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      await batch.commit();
      count += chunk.length;
      setProgress((count / BUDGETS.length) * 100);
      log(count + '/' + BUDGETS.length + ' presupuestos importados...');
    }

    log('✅ ¡IMPORTACIÓN COMPLETADA! ' + count + ' presupuestos en Firebase');
    document.getElementById('status').textContent = '✅ Importación exitosa. Abre la app para ver los presupuestos.';
    document.getElementById('status').style.background = '#d1fae5';
    document.getElementById('status').style.color = '#065f46';
  } catch(e) {
    log('❌ Error: ' + e.message);
    document.getElementById('status').textContent = '❌ Error: ' + e.message;
    document.getElementById('btnImport').disabled = false;
  }
}
</script>
