function log(msg) {
    const d = document.getElementById('log');
    const l = document.createElement('div');
    l.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    d.appendChild(l);
    d.scrollTop = d.scrollHeight;
}
function status(msg, type='progress') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
    el.style.display = 'block';
}
function progress(i, total) {
    document.getElementById('bar').style.width = Math.min(100, (i/total)*100) + '%';
}

async function cleanDb() {
    status('Limpiando...', 'progress');
    for (const coll of ['costs','exhibitions','clients']) {
        const snap = await db.collection(coll).get();
        for (const doc of snap.docs) await doc.ref.delete();
        log('✓ ' + snap.size + ' eliminados de ' + coll);
    }
    status('✅ BD limpia. Ahora pulsa Importar.', 'success');
    document.getElementById('btnImport').disabled = false;
    progress(1, 3);
}

        // 1. Crear clientes únicos
        const clientMap = new Map();
        const clientNames = [...new Set(RECORDS.map(r => r.cliente))];
        for (const name of clientNames) {
            const doc = await db.collection('clients').add({ name });
            clientMap.set(name, doc.id);
        }
        log('✓ ' + clientNames.length + ' clientes creados');

        // 2. Crear ferias únicas (una por FERIA+AÑO)
        const feriaMap = new Map();
        const feriaGroups = {};
        for (const r of RECORDS) {
            const key = r.feria + '|' + r.año;
            if (!feriaGroups[key]) feriaGroups[key] = { feria: r.feria, año: r.año, clientes: new Set() };
            feriaGroups[key].clientes.add(r.cliente);
        }

        let feriaNum = 1;
        for (const [key, info] of Object.entries(feriaGroups)) {
            const feriaId = 'Feria-' + info.año + '-' + String(feriaNum).padStart(3, '0');
            feriaNum++;
            await db.collection('exhibitions').doc(feriaId).set({
                id: feriaId,
                name: info.feria,
                year: info.año,
                totalSales: 0,
                totalCosts: 0,
                margin: 0,
                marginPercent: 0,
                createdAt: new Date().toISOString()
            });
            feriaMap.set(key, feriaId);
            log('✓ Feria: ' + feriaId + ' - ' + info.feria);
        }

        // 3. Importar costes con clientId correcto
        let n = 0;
        for (const r of RECORDS) {
            const key = r.feria + '|' + r.año;
            const feriaId = feriaMap.get(key);
            const clientId = clientMap.get(r.cliente);

            await db.collection('costs').add({
                feriaId,
                clientId,
                clientName: r.cliente,
                feriaName: r.feria,
                description: r.descripcion || '',
                provider: r.proveedor || '',
                amount: r.importe || 0,
                type: r.tipo || 'OTRO',
                status: (r.estado || 'PENDIENTE').toUpperCase(),
                year: r.año
            });

            n++;
            progress(n, RECORDS.length);
            if (n % 100 === 0) log(n + '/' + RECORDS.length);
        }

        // 4. Calcular totales por feria
        log('Calculando totales...');
        const ferias = await db.collection('exhibitions').get();
        for (const feriaDoc of ferias.docs) {
            const costs = await db.collection('costs').where('feriaId', '==', feriaDoc.id).get();
            let sales = 0, expenses = 0;
            for (const doc of costs.docs) {
                const c = doc.data();
                const amt = parseFloat(c.amount) || 0;
                if (c.type === 'VENTAS' || amt > 0) sales += Math.abs(amt);
                else expenses += Math.abs(amt);
            }
            const margin = sales - expenses;
            await feriaDoc.ref.update({
                totalSales: sales,
                totalCosts: expenses,
                margin,
                marginPercent: sales > 0 ? ((margin / sales) * 100).toFixed(2) : 0
            });
        }

        document.getElementById('sClients').textContent = clientNames.length;
        document.getElementById('sFerias').textContent = Object.keys(feriaGroups).length;
        document.getElementById('sCosts').textContent = n;
        document.getElementById('stats').style.display = 'grid';
        progress(RECORDS.length, RECORDS.length);
        log('✅ COMPLETADO');
        status('✅ Importación correcta. ' + n + ' registros con clientes correctos.', 'success');
        document.getElementById('btnView').disabled = false;
    } catch(e) {
        log('❌ ' + e.message);
        status('❌ Error: ' + e.message, 'error');
        document.getElementById('btnImport').disabled = false;
    }
}
</script>
</body>
</html>
